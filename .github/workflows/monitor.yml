name: Monitor DOL PWD Status

on:
  schedule:
    # 每天 UTC 时间 14:27 (美东约早 9 点) 执行一次
    - cron: '27 14 * * *'
  workflow_dispatch: # 支持网页端手动触发

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai requests beautifulsoup4

      - name: Run Monitor Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python monitor_pwd.py

      - name: Commit updated status
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_pwd_status.txt
          git commit -m "chore: update last pwd status [skip ci]" || exit 0
          git push
